[project]
name = "hexlet-code"
version = "0.1.0"
description = "Page Analyzer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bs4>=0.0.2",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "jinja2>=3.1.6",
    "npm>=0.1.1",
    "psycopg>=3.3.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "validators>=0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["page_analyzer"]
